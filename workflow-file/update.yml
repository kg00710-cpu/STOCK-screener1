name: Update screener data

# Times are UTC. IST = UTC + 5:30. NSE trades 09:15–15:30 IST = 03:45–10:00 UTC.
#
#  * every 15 minutes during market hours, Mon–Fri
#  * once after the close (end-of-day snapshot)
#
# Note: GitHub's scheduled runners are best-effort and can be delayed several
# minutes under load, and schedules are paused on repos with no activity for
# 60 days. For guaranteed timing, run scripts/fetch_data.py from your own
# machine/VPS cron instead — same script, same output.
on:
  schedule:
    # every 15 min, 03:45–09:59 UTC (09:15–15:29 IST)
    - cron: "45,59 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    # end-of-day snapshot: 10:15 UTC (15:45 IST), after the close settles
    - cron: "15 10 * * 1-5"
  workflow_dispatch:        # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: screener-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      

      - name: Install dependencies
        run: pip install --quiet yfinance pandas numpy

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/universe.json
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "data: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
